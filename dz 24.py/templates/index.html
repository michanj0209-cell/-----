{% extends "base.html" %}

{% block title %}Головна - Бібліотека{% endblock %}

{% block content %}
    <h1>Каталог книг</h1>

    <form action="{{ url_for('add_book') }}" method="POST">
        <input type="text" name="title" placeholder="Назва книги" required>
        <input type="text" name="author" placeholder="Автор" required>
        <input type="number" name="year" placeholder="Рік видання">
        <input type="text" name="genre" placeholder="Жанр">
        <textarea name="description" placeholder="Опис"></textarea>
        <button type="submit">Додати книгу</button>
    </form>

    <div class="books-list">
        {% for book in books %}
            <div class="book-card">
                <h3>{{ book.title }}</h3>
                <p>Автор: {{ book.author }}</p>
                <p>Рік: {{ book.year }}</p>
                <p>Жанр: {{ book.genre }}</p>
                <p>{{ book.description }}</p>
                <form action="{{ url_for('delete_book', book_id=book.id) }}" method="POST">
                    <button type="submit">Видалити</button>
                </form>
            </div>
        {% endfor %}
    </div>
{% endblock %}
